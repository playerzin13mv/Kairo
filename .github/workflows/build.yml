name: Build Kairo
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Cache do cerebro
        id: cache-modelo
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model.gguf
          key: modelo-qwen25-0_5b-q4km
      - name: Baixar o cerebro
        if: steps.cache-modelo.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 5 -o app/src/main/assets/model.gguf "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -lh app/src/main/assets/model.gguf
      - run: gradle assembleDebug
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk Kairo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Kairo.apk --title "Kairo (build ${{ github.run_number }})" --notes "APK mais recente da Kairo" --target ${{ github.sha }}
